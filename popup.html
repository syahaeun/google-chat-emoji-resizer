<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{width:270px;margin:0;padding:18px;font-family:Arial,"Malgun Gothic",sans-serif;color:#202124}
h1{margin:0 0 7px;font-size:16px;font-weight:600}
.description{margin:0 0 16px;font-size:12px;line-height:1.5;color:#5f6368}
.label{display:block;margin-bottom:8px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{height:38px;border:1px solid #dadce0;border-radius:6px;background:#fff;color:#202124;cursor:pointer;font-size:13px}
button:hover{background:#f1f3f4}
button.selected{border:2px solid #1a73e8;background:#e8f0fe;color:#1a73e8;font-weight:600}
.status{margin-top:15px;padding-top:12px;border-top:1px solid #eee;font-size:12px;color:#5f6368}
.note{margin-top:8px;font-size:11px;line-height:1.4;color:#80868b}
</style>
</head>
<body>
<h1>Google Chat 이모티콘 확대</h1>
<p class="description">메시지 이모티콘만 확대하며 반응 및 반응 선택창은 제외합니다.</p>
<span class="label">크기</span>
<div class="grid">
<button data-size="40">40px</button>
<button data-size="60">60px</button>
<button data-size="80">80px</button>
<button data-size="100">100px</button>
<button data-size="120">120px</button>
</div>
<div id="status" class="status"></div>
<div class="note">호버하여 반응을 추가하는 메뉴의 이모티콘은 원래 크기로 유지합니다.</div>
<script src="popup.js"></script>
</body>
</html>
